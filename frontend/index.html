<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MentorLink — Trusted In-Home Learning</title>
    <meta name="theme-color" content="#183b34" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MentorLink" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/mentorlink-icon.svg" />
    <!-- Telegram WebApp JS Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Avoid third-party font downloads when the user or network requests data saving.
      try {
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const lowData = localStorage.getItem('mentorlink-low-data') === '1' || connection?.saveData;
        if (!lowData) {
          const preconnect = document.createElement('link');
          preconnect.rel = 'preconnect';
          preconnect.href = 'https://fonts.googleapis.com';
          document.head.appendChild(preconnect);
          const fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap';
          document.head.appendChild(fontLink);
        }
      } catch (_) {}
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
